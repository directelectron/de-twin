name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # Timing budgets are tuned on a workstation; shared runners get 5x (see tests/perf_budget.py).
  DE_TWIN_PERF_SLACK: "5"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check

      - name: Check formatting
        run: uv run ruff format --check

  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        exclude:
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.11"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      # DE-Server's ExternalFrameSource is plain Win32 C++: build the stand-alone
      # consumer so the layout and C++ <-> Python interop tests run on Windows.
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build the C++ frame-source check (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cd cpp
          if not exist build mkdir build
          cl /nologo /std:c++17 /EHsc /W4 /WX /O2 /Fobuild\ /Fe:build\test_consumer.exe test_consumer.cpp ExternalFrameSource.cpp

      - name: Run tests
        run: uv run pytest -v --tb=short --timeout 1800

  minimum-deps:
    name: Minimum deps (Python 3.10 / ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
          enable-cache: true

      - name: Install dependencies at minimum versions
        run: uv sync --group dev --resolution lowest-direct

      - name: Show installed versions
        run: uv pip list

      - name: Run tests
        run: uv run pytest -v --tb=short --timeout 1800

  package:
    name: Build and check the distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Build wheel and sdist
        run: uv build

      - name: Check metadata
        run: uvx twine check --strict dist/*

      - name: Install the wheel into a clean environment and import it
        run: |
          uv venv /tmp/wheel-env
          uv pip install --python /tmp/wheel-env dist/*.whl
          /tmp/wheel-env/bin/python -c "import de_twin; from de_twin import DigitalTwin; print(de_twin.__version__)"
          /tmp/wheel-env/bin/de-twin list

      - name: Preview the next changelog
        run: uvx towncrier build --draft --version NEXT
