name: Prepare Release

# Run manually from the Actions tab.
# Opens a PR that bumps the version, builds CHANGELOG.rst from the towncrier
# fragments in upcoming_changes/, and adds the version to the docs switcher.
# After merging it, create the GitHub Release by hand (tag v<version>); that
# triggers the Release workflow, which publishes to PyPI.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version component to bump"
        required: true
        type: choice
        options:
          - minor
          - bugfix
          - major
          - finalize      # drop the bN suffix: release the current beta's base as stable (0.3.0b2 -> 0.3.0)
          - pre-release   # increments the bN counter on the current base version
      beta:
        description: "Mark as beta pre-release (adds bN suffix). Ignored for 'pre-release' (always beta) and 'finalize' (always stable)."
        required: false
        type: boolean
        default: false

permissions:
  contents: write        # push branch
  pull-requests: write   # open PR

jobs:
  prepare:
    name: Prepare release PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      # ── Compute the new version ──────────────────────────────────────────
      - name: Compute new version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          IS_BETA: ${{ inputs.beta }}
        run: |
          CURRENT=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          export CURRENT_VERSION="$CURRENT"

          NEW_VERSION=$(python3 - <<'PYEOF'
          import re, os

          current = os.environ["CURRENT_VERSION"]
          bump    = os.environ["BUMP"]
          is_beta = os.environ["IS_BETA"].lower() == "true"

          m = re.match(r"^(\d+)\.(\d+)\.(\d+)(?:b(\d+))?", current)
          major, minor, patch = int(m.group(1)), int(m.group(2)), int(m.group(3))
          beta_n = int(m.group(4)) if m.group(4) else None
          on_beta = beta_n is not None

          if bump == "finalize":
              if not on_beta:
                  raise SystemExit(f"'finalize' needs a beta version, but the current version is {current!r}.")
              is_beta = False
          elif bump == "pre-release":
              is_beta = True
              beta_n = (beta_n or 0) + 1
          elif on_beta:
              raise SystemExit(
                  f"{current!r} is a beta of the upcoming {major}.{minor}.{patch} release. "
                  f"Use bump='finalize' to ship it; a '{bump}' bump would skip it.")
          elif bump == "major":
              major, minor, patch = major + 1, 0, 0
          elif bump == "minor":
              minor, patch = minor + 1, 0
          elif bump == "bugfix":
              patch += 1

          if is_beta:
              if bump != "pre-release":
                  beta_n = 1
              print(f"{major}.{minor}.{patch}b{beta_n}", end="")
          else:
              print(f"{major}.{minor}.{patch}", end="")
          PYEOF
          )

          if [[ "$NEW_VERSION" =~ b[0-9]+$ ]]; then IS_BETA_OUT=true; else IS_BETA_OUT=false; fi
          echo "new_version=$NEW_VERSION"     >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW_VERSION"            >> "$GITHUB_OUTPUT"
          echo "branch=release/v$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "is_beta=$IS_BETA_OUT"         >> "$GITHUB_OUTPUT"
          echo "Bumping (${{ inputs.bump }}): $CURRENT -> $NEW_VERSION"

      - name: Bump version in pyproject.toml
        run: sed -i 's/^version = ".*"/version = "${{ steps.version.outputs.new_version }}"/' pyproject.toml

      # ── Build changelog ──────────────────────────────────────────────────
      - name: Build changelog with towncrier
        run: |
          FRAGMENT_COUNT=$(find upcoming_changes -maxdepth 1 -name "*.rst" ! -name "README.rst" | wc -l)
          if [ "$FRAGMENT_COUNT" -eq 0 ]; then
            echo "No news fragments found; CHANGELOG.rst unchanged."
          else
            uvx towncrier build --yes --version "${{ steps.version.outputs.new_version }}"
          fi

      # ── Update docs switcher.json ────────────────────────────────────────
      - name: Update docs/_root/switcher.json
        env:
          VERSION_TAG: ${{ steps.version.outputs.tag }}
          IS_BETA: ${{ steps.version.outputs.is_beta }}
        shell: python
        run: |
          import json, pathlib, os

          version = os.environ["VERSION_TAG"]
          is_beta = os.environ["IS_BETA"].lower() == "true"
          path = pathlib.Path("docs/_root/switcher.json")
          entries = [e for e in json.loads(path.read_text()) if e.get("version") != version]
          label = f"{version} (beta)" if is_beta else f"{version} (stable)"
          url = f"https://directelectron.github.io/de-twin/{version}/"
          entries.insert(1, {"name": label, "version": version, "url": url})
          path.write_text(json.dumps(entries, indent=2) + "\n")

      # ── Point the docs root at stable releases ───────────────────────────
      - name: Update root redirect (stable releases only)
        if: ${{ steps.version.outputs.is_beta == 'false' }}
        env:
          VERSION_TAG: ${{ steps.version.outputs.tag }}
        shell: python
        run: |
          import re, pathlib, os

          version = os.environ["VERSION_TAG"]
          path = pathlib.Path("docs/_root/index.html")
          text = path.read_text()
          text = re.sub(r'(content="0; url=)[^"]+(")', rf"\g<1>{version}/\2", text)
          text = re.sub(r'(rel="canonical" href=")[^"]+(")', rf"\g<1>{version}/\2", text)
          text = re.sub(r'(<a href=")[^"]+(">)[^<]*(</a>)', rf"\g<1>{version}/\g<2>{version} documentation\3", text)
          path.write_text(text)

      # ── Commit, push, open the PR ────────────────────────────────────────
      - name: Commit release changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${{ steps.version.outputs.branch }}"
          git add pyproject.toml CHANGELOG.rst docs/_root/switcher.json docs/_root/index.html
          git add -A upcoming_changes/
          git commit -m "chore: prepare release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.branch }}"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          gh pr create \
            --title "Release ${TAG}" \
            --base  main \
            --head  "${BRANCH}" \
            --body  "## Release ${TAG}

          > Auto-generated by the **Prepare Release** workflow.

          - Version bumped to \`${TAG}\` in \`pyproject.toml\`
          - \`CHANGELOG.rst\` built from the towncrier fragments (consumed fragments removed)
          - \`docs/_root/switcher.json\` has the new version

          ### Review checklist
          - [ ] \`CHANGELOG.rst\` reads well (edit it here if needed)
          - [ ] CI passes

          ### After merging
          Create the release on GitHub: **Releases → Draft a new release**, tag \`${TAG}\`
          on \`main\`, title \`${TAG}\`, paste this version's \`CHANGELOG.rst\` section as
          the notes (tick *pre-release* for a beta), and **Publish**. Publishing triggers
          the Release workflow, which uploads the package to PyPI and attaches the wheel
          and sdist to the release."
