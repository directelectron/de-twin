name: Release

# Fires when a GitHub Release is published. Releases are made by hand on GitHub
# (after the "Prepare Release" PR is merged): create a release whose tag is
# v<version from pyproject.toml>, paste the changelog section as its notes, and
# publish it.
#
# Jobs:
#   build    - check the tag matches pyproject.toml, build wheel + sdist with uv
#   publish  - upload to PyPI via OIDC trusted publishing (no API token needed)
#   assets   - attach the wheel and sdist to the GitHub Release

on:
  release:
    types: [published]

permissions:
  contents: write    # upload release assets
  id-token: write    # OIDC token for PyPI trusted publishing

jobs:
  # --------------------------------------------------------------------------
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Release tag $TAG does not match pyproject.toml version v$VERSION. Merge the Prepare Release PR first, then tag its commit."
            exit 1
          fi

      - name: Build wheel and sdist
        run: uv build

      - name: Check metadata
        run: uvx twine check --strict dist/*

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # --------------------------------------------------------------------------
  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/de-twin

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Trusted publishing - no API token required.
      # One-time setup on pypi.org: add a (pending) publisher for
      #   Project: de-twin  Owner: directelectron  Repo: de-twin
      #   Workflow: release.yml  Environment: pypi
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # --------------------------------------------------------------------------
  assets:
    name: Attach dist to the GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber --repo "${{ github.repository }}"
